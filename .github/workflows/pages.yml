name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish dist to gh-pages
        # Branch-based Pages needs no settings step: creating a gh-pages
        # branch auto-configures the site. The branch holds only build output.
        run: |
          touch dist/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git --work-tree dist add --all
          git --work-tree dist commit -m "deploy: ${GITHUB_SHA}"
          git push origin HEAD:gh-pages --force
